[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cakradana-ai"
version = "0.1.0"
description = "Risk detection for Indonesian political donations"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.3,<5.0",
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "faker>=25.0,<40.0",
]

[project.scripts]
cakradana = "cakradana.cli:main"

[tool.setuptools.packages.find]
include = ["cakradana*"]

[tool.setuptools.package-data]
cakradana = ["rules/rulesets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:cakradana.*"]
