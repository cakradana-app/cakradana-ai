- code: PASS_THROUGH
  status: rejected
  reviewer: Faiz A <m@faiz.at>
  reviewed_at: '2026-08-17T12:24:29.555393+00:00'
  note: '"Forwarded" is the conclusion, not the observation. What is observed is that
    money arrived and money left within a window; that the second is the first passing
    through is precisely what the analyst is being asked to decide, and the sentence
    decides it for them. "Received {inflow_total} and then donated {outflow} within
    {lag_days} days" states the same facts and leaves the inference where it belongs.
    The ratio is fine and should stay.'
  statements:
  - '{sender} received {inflow_total} and forwarded {outflow} within {lag_days} days,
    a ratio of {ratio}.'
