- code: ADVERSE_COVERAGE
  status: validated
  reviewer: Faiz A <m@faiz.at>
  reviewed_at: '2026-08-17T12:24:10.055453+00:00'
  note: The disclaimer is doing real work and is the reason this passes. Coverage
    of a person is evidence about what was published, not about what they did, and
    the sentence says exactly that in its own words rather than leaving it to be understood.
    Counts and independent-source counts are checkable, and the stage of proceedings
    is stated rather than characterised.
  statements:
  - '{count} item(s) of published coverage across {sources} independent sources report
    {stage} concerning this donor. This is what has been written, not a finding about
    what the donor did.'
