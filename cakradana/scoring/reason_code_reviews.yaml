  reviewed_at: '2026-08-17T12:24:25.936842+00:00'
  note: States nothing observable. "Ranked above most others" is a property of the
    model's output distribution, not of this donation, and there is nothing in it
    an analyst can check against the record or quote into a case note. The three things
    it names — donor history, recipient pattern, amount — are the inputs, so the sentence
    describes the model rather than the donation. The lane's own contribution is already
    stated by the specific codes beside it; this adds a summary of the model to a
    list that is supposed to be evidence.
  statements:
