- code: LAYERING_CHAIN
  status: rejected
  reviewer: Faiz A <m@faiz.at>
  reviewed_at: '2026-08-17T12:24:24.514526+00:00'
  note: Three conclusions in one sentence. "Layering" is a term of art for a deliberate
    laundering stage, "chain" asserts the donations are connected rather than co-occurring,
    and "intermediate entities" asserts a role for parties who may simply have donated.
    The observation is that these donations occurred in this sequence, between these
    parties, inside this window. An analyst who reads that may well conclude layering;
    the reason should not conclude it for them, and an entity described as intermediate
    in a case note has been characterised by the system rather than by a person.
  statements:
  - This donation is one leg of a chain of {donations} passing through {counterparties}
    intermediate entities.
