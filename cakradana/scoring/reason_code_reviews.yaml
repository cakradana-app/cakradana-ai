- code: UNUSUAL_COMBINATION
  status: rejected
  reviewer: Faiz A <m@faiz.at>
  reviewed_at: '2026-08-17T12:24:47.270465+00:00'
  note: Unfalsifiable as written. "Unlike the donations around it" names no quantity,
    no comparison set, and no threshold, so an analyst cannot tell whether it is a
    near miss or an extreme, and cannot disagree with it. The honest form of an anomaly
    reason states which quantities were unusual and by how much against what population;
    without that the code says only that the anomaly lane fired, which its presence
    in the list already says.
  statements:
  - This donation's combination of amount, donor history, and recipient pattern is
    unlike the donations around it, without matching any known pattern.
